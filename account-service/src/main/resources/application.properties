spring.config.import=optional:file:${user.dir}/../.env[.properties],optional:file:${user.dir}/.env[.properties]
server.port=8081
spring.application.name=account-service


# Demo secret only — override with RIDELINK_JWT_SECRET env var in real deployments
ridelink.jwt.secret=${RIDELINK_JWT_SECRET:RideLinkDemoSecretKeyForJwtSigningMustBeLongEnough123}
ridelink.jwt.expiration-ms=86400000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html



spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:ridelink}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${MONGODB_DATABASE:ridelink}
