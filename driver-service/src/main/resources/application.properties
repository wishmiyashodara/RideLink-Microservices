spring.config.import=optional:file:${user.dir}/../.env[.properties],optional:file:${user.dir}/.env[.properties]
spring.application.name=driver-vehicle-service

server.port=8080
server.address=0.0.0.0

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Ride Service
springdoc.swagger-ui.urls[0].url=http://localhost:8082/v3/api-docs
springdoc.swagger-ui.urls[1].name=Driver Vehicle Service
springdoc.swagger-ui.urls[1].url=http://localhost:8080/v3/api-docs
springdoc.swagger-ui.urls[2].name=Account Service
springdoc.swagger-ui.urls[2].url=http://localhost:8081/v3/api-docs
springdoc.swagger-ui.urls[3].name=Fare Payment Service
springdoc.swagger-ui.urls[3].url=http://localhost:8083/v3/api-docs
springdoc.swagger-ui.urls-primary-name=Ride Service

# MongoDB Configuration — Driver & Vehicle Service uses DriverVehicleDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=DriverVehicleDB
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=DriverVehicleDB

# JWT Secret — shared across all services
ridelink.jwt.secret=${RIDELINK_JWT_SECRET}
